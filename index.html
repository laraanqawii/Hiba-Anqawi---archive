<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>أرشيفي</h1>
      <div class="owner">Hiba Anqawi</div>
      <div class="sub">درج صغير للاختبارات والتحضير والخطط</div>
    </div>
    <div class="top-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحثي بالعنوان أو المحتوى…">
      </div>
      <button class="btn btn-primary" id="addBtn">+ إضافة ملف</button>
    </div>
  </header>

  <div id="modeBanner" class="mode-banner" style="display:none;"></div>

  <div class="verse-banner">
    <div class="verse-track">﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾</div>
  </div>

  <div class="rail" id="tabsNav"></div>
  <div class="folder-body">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">إضافة ملف جديد</h2>
    <div class="field">
      <label>الفئة</label>
      <div class="cat-picker" id="catPicker">
        <button type="button" class="cat-chip" data-cat="اختبار">اختبار</button>
        <button type="button" class="cat-chip" data-cat="تحضير">تحضير</button>
        <button type="button" class="cat-chip" data-cat="خطة">خطة</button>
      </div>
    </div>
    <div class="field">
      <label>العنوان</label>
      <input type="text" id="fTitle" placeholder="مثال: اختبار الفصل الثاني - رياضيات">
    </div>
    <div class="row-2">
      <div class="field">
        <label>المادة / الصف</label>
        <input type="text" id="fSubject" placeholder="مثال: صف حادي عشر">
      </div>
      <div class="field">
        <label>التاريخ</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="field">
      <label>الملاحظات / المحتوى</label>
      <textarea id="fContent" placeholder="أي تفاصيل تحبي تحتفظي فيها…"></textarea>
    </div>
    <div class="field">
      <label>إرفاق ملف (Word / PDF / صورة …)</label>
      <input type="file" id="fFile">
    </div>
    <div class="field">
      <label>أو رابط خارجي (اختياري)</label>
      <input type="url" id="fLink" placeholder="https://…">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
      <button class="btn btn-primary" id="saveBtn">حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
